services:
  migrate:
    build: .
    # Match the local operator so the dashboard can later remove its own
    # generated artifacts from the bind-mounted data directory.
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models:ro
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
    restart: "no"

  web:
    build: .
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["uvicorn", "tubeforge.main:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # The one documented developer dashboard URL is loopback-only:
      # http://127.0.0.1:62065
      - "127.0.0.1:62065:8080"
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models:ro
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
    restart: unless-stopped
    mem_limit: 512m

  worker:
    build: .
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["python", "-m", "tubeforge.workers.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      # Operator-supplied Piper ONNX voices and adjacent .onnx.json files.
      - ./models:/app/models:ro
      - /run/tubeforge-codex:/run/tubeforge-codex
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
    restart: unless-stopped
    mem_limit: 1g

  scheduler:
    build: .
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["python", "-m", "tubeforge.scheduling.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models:ro
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
    restart: unless-stopped
    mem_limit: 256m
