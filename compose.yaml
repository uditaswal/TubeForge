services:
  migrate:
    build: .
    image: tubeforge-app:local
    # Match the local operator so the dashboard can later remove its own
    # generated artifacts from the bind-mounted data directory.
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./src:/app/src:ro
      # Migrations are mounted so a new revision applies without rebuilding the image.
      - ./migrations:/app/migrations:ro
      - ./.agents/skills:/app/.agents/skills:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models:ro
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
    restart: "no"

  web:
    build: .
    image: tubeforge-app:local
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    # OAuth callback query strings contain short-lived authorization codes.
    command: ["uvicorn", "tubeforge.main:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      piper-tts:
        condition: service_healthy
    ports:
      # The one documented developer dashboard URL is loopback-only:
      # http://127.0.0.1:62065
      - "127.0.0.1:62065:8080"
    volumes:
      - ./src:/app/src:ro
      - ./.agents/skills:/app/.agents/skills:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models:ro
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
      TUBEFORGE_PIPER_SERVER_URL: http://piper-tts:5000
      TUBEFORGE_ACCOUNT_ENCRYPTION_KEY: ${TUBEFORGE_ACCOUNT_ENCRYPTION_KEY:-}
      TUBEFORGE_GOOGLE_OAUTH_CLIENT_ID: ${TUBEFORGE_GOOGLE_OAUTH_CLIENT_ID:-}
      TUBEFORGE_GOOGLE_OAUTH_CLIENT_SECRET: ${TUBEFORGE_GOOGLE_OAUTH_CLIENT_SECRET:-}
      TUBEFORGE_GOOGLE_OAUTH_REDIRECT_URI: ${TUBEFORGE_GOOGLE_OAUTH_REDIRECT_URI:-}
    restart: unless-stopped
    mem_limit: 512m

  worker:
    build: .
    image: tubeforge-app:local
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["python", "-m", "tubeforge.workers.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      piper-tts:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./.agents/skills:/app/.agents/skills:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      # Operator-supplied Piper ONNX voices and adjacent .onnx.json files.
      - ./models:/app/models:ro
      - /run/tubeforge-codex:/run/tubeforge-codex
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
      TUBEFORGE_PIPER_SERVER_URL: http://piper-tts:5000
      # Optional stock B-roll for reference Shorts; unset disables Pixabay.
      TUBEFORGE_PIXABAY_API_KEY: ${TUBEFORGE_PIXABAY_API_KEY:-}
    restart: unless-stopped
    # Reference Shorts run Kokoro, Whisper alignment and the encoder sequentially.
    mem_limit: 3g

  piper-tts:
    build: .
    image: tubeforge-app:local
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["python", "-m", "tubeforge.tts_server"]
    expose: ["5000"]
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./models:/app/models:ro
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
      TUBEFORGE_PIPER_LISTEN_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m

  publisher-worker:
    profiles: ["publishing"]
    build: .
    image: tubeforge-app:local
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["python", "-m", "tubeforge.publishing_worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src:ro
      - ./.agents/skills:/app/.agents/skills:ro
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
      TUBEFORGE_ACCOUNT_ENCRYPTION_KEY: ${TUBEFORGE_ACCOUNT_ENCRYPTION_KEY:-}
    restart: unless-stopped
    mem_limit: 512m

  scheduler:
    build: .
    image: tubeforge-app:local
    user: "${TUBEFORGE_HOST_UID:-1000}:${TUBEFORGE_HOST_GID:-1000}"
    command: ["python", "-m", "tubeforge.scheduling.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src:ro
      - ./.agents/skills:/app/.agents/skills:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models:ro
    environment:
      TUBEFORGE_CONFIG: /app/config/production.yaml
      PYTHONPATH: /app/src
    restart: unless-stopped
    mem_limit: 256m
