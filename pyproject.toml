[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "tubeforge"
version = "0.1.0"
description = "Self-hosted, provider-agnostic YouTube production pipeline"
readme = "readme.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "uvicorn>=0.32,<1",
  "yt-dlp>=2025.1.15,<2027",
]

[project.scripts]
tubeforge = "tubeforge.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]
local-media = [
  # Provides the local ``piper`` CLI. Voice models remain operator-supplied
  # because they are large, language-specific runtime data.
  "piper-tts>=1.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tubeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
