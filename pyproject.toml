[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "tubeforge"
version = "0.1.0"
description = "Self-hosted, provider-agnostic YouTube production pipeline"
readme = "readme.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "croniter>=3.0,<7",
  "argon2-cffi>=23.1,<26",
  "cryptography>=42,<47",
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "uvicorn>=0.32,<1",
  "yt-dlp>=2026.10.21,<2027",
  "tiktoken>=0.12,<1",  # LF2 local text/schema measurement, not subscription accounting
]

[project.scripts]
tubeforge = "tubeforge.cli:main"

[project.optional-dependencies]
codex-runner = ["Pillow>=11,<13"]
reference-renderer = [
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "soundfile>=0.13,<1",
  "pygments>=2.17,<3",
  "playwright>=1.45,<2",  # drives the system Chromium (no browser download) for source screenshots
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.2,<2",
  "jsonschema>=4.23,<5",
]
local-media = [
  # Provides the local ``piper`` CLI. Voice models remain operator-supplied
  # because they are large, language-specific runtime data.
  "piper-tts>=1.3,<2",
]
kokoro = [
  # CPU-friendly ONNX runtime; model and voice-pack files stay operator-owned.
  "kokoro-onnx>=0.3.8,<1",
]
clips = [
  # Source clipping: transcript-driven moment selection, face-aware vertical crop, captions.
  "faster-whisper==1.2.1",
  "av>=14,<17",  # faster-whisper 1.2.1 opens audio with an option PyAV 17 and later removed
  "opencv-python-headless>=4.8,<5",
  "numpy>=2,<3",
  "pydantic-ai-slim>=1.107.7,<2",
  "srt>=3.5.3,<4",
  "srt-equalizer>=0.1.10,<1",
  "curl-cffi>=0.10,<0.17",
  "bgutil-ytdlp-pot-provider==2.0.2",
  "httpx>=0.28,<1",
]
alignment = [
  # Opt-in English audio-grounded timing; model assets remain operator-supplied.
  "faster-whisper==1.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tubeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "tubeforge/content_skills"
