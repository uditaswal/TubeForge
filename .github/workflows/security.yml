name: security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep linux_x64 "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --log-opts="--all" --redact --exit-code 1

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pre-commit hooks (except gitleaks, run above)
        env:
          SKIP: gitleaks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
      - name: no tracked files that .gitignore excludes
        run: test -z "$(git ls-files -ci --exclude-standard)"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (runtime + optional extras)
        run: |
          pip install pip-audit
          pip install ".[dev,reference-renderer]"
          pip-audit --skip-editable --progress-spinner off
