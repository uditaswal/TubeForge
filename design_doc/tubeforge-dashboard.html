function zparts(d,tz='Asia/Kolkata'){const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d);return Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));}
function wallUtc(y,m,d,h,min,tz){let target=Date.UTC(y,m-1,d,h,min),guess=target;for(let i=0;i<4;i++){const p=zparts(new Date(guess),tz);const delta=target-Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second);guess+=delta;if(!delta)break;}return new Date(guess);}
function nextSlots(a,count=5,now=new Date()){const p=zparts(now,a.timezone),out=[];for(let i=0;i<40&&out.length<count;i++){const day=new Date(Date.UTC(p.year,p.month-1,p.day+i));if(!a.weekdays.includes(day.getUTCDay()))continue;for(const slot of [...a.slots].sort()){const [h,m]=slot.split(':').map(Number);const t=wallUtc(day.getUTCFullYear(),day.getUTCMonth()+1,day.getUTCDate(),h,m,a.timezone);if(t>now)out.push(t);} }return out.slice(0,count);}

function renderOverview(){const ready=state.assets.filter(a=>a.state==='ready').length,attention=state.jobs.filter(j=>['partial','unknown_outcome','archive_pending'].includes(j.state)),active=state.automations.filter(a=>a.active),upcoming=active.flatMap(a=>nextSlots(a,3).map(date=>({a,date}))).sort((a,b)=>a.date-b.date).slice(0,4),recent=state.jobs.slice(0,4);return head(button(icon(state.paused?'play':'pause')+(state.paused?'Resume new work':'Pause new work'),'pause-global','','ghost')+button(icon('plus')+'Compose a video','nav-compose','','primary'))+`<div class="grid4"><div class="stat"><div class="row between"><span class="stat-label">Next scheduled slot</span>${icon('clock')}</div><div class="value">${upcoming[0]?timeLabel(upcoming[0].date,upcoming[0].a.timezone):'—'}</div><div class="tiny muted">${upcoming[0]?dateLabel(upcoming[0].date,upcoming[0].a.timezone)+' · '+esc(upcoming[0].a.timezone):'Create an automation to plan a slot'}</div></div><div class="stat"><div class="row between"><span class="stat-label">Ready in library</span>${icon('library')}</div><div class="value">${ready}<span class="muted" style="font-size:13px;letter-spacing:0"> videos</span></div><div class="tiny muted">Counted from this demo's catalog</div></div><div class="stat"><div class="row between"><span class="stat-label">Automations enabled</span>${icon('bolt')}</div><div class="value">${active.length}<span class="muted" style="font-size:13px;letter-spacing:0"> of ${state.automations.length}</span></div><div class="tiny muted">${state.paused?'Workspace dispatch is paused':'One video per slot, all chosen accounts'}</div></div><div class="stat"><div class="row between"><span class="stat-label">Needs your attention</span>${icon('alert')}</div><div class="value" style="color:var(--amber)">${attention.length}</div><div class="tiny muted">Partial, uncertain or archive pending</div></div></div><div class="callout"><div class="row" style="gap:15px">${icon(state.paused?'pause':'bolt')}<div><h3>${state.paused?'New work is paused':'A publishing rhythm you can trust'}</h3><p class="small muted" style="margin-top:5px">${state.paused?'Already accepted remote schedules need separate cancellation.':'Reserve one video, track each destination, archive after confirmation.'}</p></div></div>${button(state.paused?'Review pending schedules '+icon('arrow'):'Manage automations '+icon('arrow'),state.paused?'cancel-schedules':'nav-automations','','ghost')}</div><div class="split"><section class="panel"><div class="panel-head"><div><h2>Coming up</h2><p>Preparation and publication are separate.</p></div>${pill('Asia/Kolkata')}</div>${upcoming.length?upcoming.map(({a,date})=>`<div class="timeline-item"><div class="time-block">${timeLabel(date,a.timezone)}<small>${new Intl.DateTimeFormat('en-IN',{timeZone:a.timezone,day:'numeric',month:'short'}).format(date)}</small></div><div class="thumb">${art(a.source==='generation'?'city':'orbit')}</div><div class="grow"><strong class="small">${esc(a.name)}</strong><div class="asset-sub">${sourceName(a.source)} · ${a.accounts.length} destinations</div><div class="tiny muted" style="margin-top:4px">${a.timing==='publish'?'Prepare '+a.lead+' min earlier':'Preparation starts at this slot'}</div></div>${pill(state.paused?'Paused':'Planned',state.paused?'':'purple')}</div>`).join(''):`<div class="empty">${icon('calendar')}<h3>No upcoming demo slots</h3><p>Create or enable an automation to preview its next runs.</p></div>`}<div class="row between mt"><span class="tiny muted">Sample schedule · no server cron is running</span>${button('View next five','schedule-preview','','ghost small-btn')}</div></section><section class="panel"><div class="panel-head"><div><h2>Attention inbox</h2><p>Repair the affected step, keep the rest.</p></div>${pill(attention.length+' items','amber')}</div>${attention.length?attention.map(j=>`<div class="timeline-item" style="align-items:flex-start">${icon(j.state==='archive_pending'?'folder':'alert')}<div class="grow"><strong class="small">${esc(j.title)}</strong><div class="asset-sub">${j.state==='partial'?'One destination failed. The successful delivery is retained.':j.state==='unknown_outcome'?'Inspect the saved upload session before retrying.':'Delivery succeeded. Only the archive move remains.'}</div><div class="mt" style="margin-top:9px">${button(j.state==='archive_pending'?'Retry archive':j.state==='unknown_outcome'?'Inspect saved session':'Review deliveries',j.state==='archive_pending'?'archive-job':j.state==='unknown_outcome'?'inspect-job':'nav-activity',`data-id="${j.id}"`,'small-btn ghost')}</div></div></div>`).join(''):`<div class="empty">${icon('check')}<h3>Nothing needs attention</h3><p>Your demo records have no unresolved delivery steps.</p></div>`}</section></div><div class="split mt"><section class="panel"><div class="panel-head"><div><h2>Recent runs</h2><p>Source selection stays shared across destinations.</p></div>${button('All activity '+icon('arrow'),'nav-activity','','ghost small-btn')}</div>${recent.map(j=>`<div class="row between" style="padding:13px 0;border-bottom:1px solid var(--border)"><span class="grow"><strong class="small">${esc(j.title)}</strong><small class="asset-sub" style="display:block">${esc(j.id)} · ${j.destinations.length} destinations · ${sourceName(j.source)}</small></span>${status(j.state)}</div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h2>Production workspace</h2><p>Make a good video before making a batch.</p></div>${icon('video')}</div><div class="row" style="gap:14px"><div class="thumb wide">${art('diagram')}</div><div class="grow"><strong class="small">${esc(production().title)}</strong><div class="asset-sub">${production().scenes.length} scenes · ${production().scenes.reduce((n,s)=>n+s.duration,0)}s · portrait</div></div></div><div class="quality-row mt">${icon('alert')}<span class="grow">${production().scenes.filter(s=>s.visual!=='current'||s.audio!=='current').length} scene dependencies need repair</sp function renderAutomations(){return head(button(icon('plus')+'New automation','new-automation','','primary'))+`<div class="note mb">One distinct video per slot is delivered to every selected account. Separate channel content uses separate automations.</div><div class="grid3">${state.automations.map(a=>`<article class="auto-card"><div class="row between"><span class="auto-icon">${icon(a.source==='folder'?'folder':a.source==='generation'?'video':'scissors')}</span>${status(a.active?'active':'paused')}</div><h2 style="margin-top:16px">${esc(a.name)}</h2><p class="small muted" style="margin-top:5px">${sourceName(a.source)} · ${esc(getPreset(a.preset)?.name||'No preset')}</p><div class="auto-details"><div><small>Publishing slots</small><strong>${a.slots.join(' & ')}<span class="tiny muted"> · ${esc(a.timezone)}</span></strong></div><div><small>Mode</small><strong>${a.timing==='publish'?'Publish at slot':'Start preparing at slot'}</strong></div><div><small>Preparation</small><strong>${a.lead} min lead · buffer ${a.buffer}</strong></div><div><small>Review policy</small><strong>${a.review==='review'?'Review first':'Automatic after readiness'}</strong></div></div><div class="row gap-6">${a.accounts.map(id=>`<span class="account-pill">${platform(getAccount(id)?.platform||'youtube')}${esc(accountName(id))}</span>`).join('')}</div><hr class="divider"><div class="row">${button(icon('compose')+'Edit','edit-automation',`data-id="${a.id}"`,'ghost small-btn')}${button(icon(a.active?'pause':'play')+(a.active?'Pause':'Enable'),'toggle-automation',`data-id="${a.id}"`,'ghost small-btn')}${button(icon('copy'),'duplicate-automation',`data-id="${a.id}" aria-label="Duplicate ${esc(a.name)}"`,'ghost small-btn')}</div><div class="row between" style="margin-top:16px"><span class="tiny muted">${nextSlots(a,1)[0]?dateLabel(nextSlots(a,1)[0],a.timezone):'No eligible slots'}</span>${button('Try next run','run-automation',`data-id="${a.id}"`,'small-btn')}</div></article>`).join('')}<button class="auto-card" data-action="new-automation" style="text-align:left;color:var(--muted);min-height:300px;border-style:dashed"><span class="auto-icon">${icon('plus')}</span><h2 style="margin-top:20px;color:var(--text)">Add a new rhythm</h2><p class="small" style="margin-top:10px">Folder backlog, generated videos or unused stream moments.</p><p class="tiny" style="margin-top:20px">Exact destinations. Saved presets. Clear completion rules.</p></button></div><div class="grid2 mt"><section class="panel"><h3>Scheduling policy</h3><div class="kv"><span>Default late grace</span><span>${state.settings.grace} minutes</span></div><div class="kv"><span>After the deadline</span><span>Roll prepared asset to next slot</span></div><div class="kv"><span>Empty source</span><span>Skip and alert</span></div><div class="kv"><span>After downtime</span><span>No burst publishing or previous-video fallback</span></div></section><section class="panel"><h3>Pause and cancellation</h3><p class="small muted mt">Pausing stops new dispatch. An accepted remote schedule requires its own cancellation and reconciliation.</p><div class="row mt">${button('Preview next five slots','schedule-preview','','ghost')}${button('Cancel pending demo schedules','cancel-schedules','','danger ghost')}</div></section></div>`;}
function libraryRows(){const term=state.librarySearch.toLowerCase();return state.assets.filter(a=>(state.libraryFilter==='all'||a.state===state.libraryFilter)&&(a.title+' '+a.filename+' '+sourceName(a.source)).toLowerCase().includes(term)).sort((a,b)=>(b.priority||0)-(a.priority||0)||a.ingested.localeCompare(b.ingested)||a.id.localeCompare(b.id));}
function renderLibrary(){const rows=libraryRows(),per=6,total=Math.max(1,Math.ceil(rows.length/per));state.libraryPage=Math.min(state.libraryPage,total);const visible=rows.slice((state.libraryPage-1)*per,state.libraryPage*per);return head(button(icon('upload')+'Add local videos','upload-videos','','primary'))+`<div class="tabs" role="tablist" aria-label="Asset status">${[['all','All videos'],['ready','Ready'],['reserved','Reserved'],['review','Needs review'],['published','Archive pending'],['archived','Archived'],['excluded','Excluded']].map(([key,label])=>`<button role="tab" aria-selected="${state.libraryFilter===key}" data-action="library-filter" data-id="${key}" class="${state.libraryFilter===key?'active':''}">${label}<span class="tiny muted" style="margin-left:7px">${key==='all'?state.assets.length:state.assets.filter(a=>a.state===key).length}</span></button>`).join('')}</div><div class="filter-row"><input aria-label="Search video library" placeholder="Search title or filename…" value="${esc(state.librarySearch)}" data-bind="librarySearch"><div class="row">${pill('Oldest first · priority respected')}${button(icon('refresh')+'Demo scan','scan-folder','','ghost small-btn')}</div></div><section class="panel" style="padding:0"><div class="table-wrap"><table><thead><tr><th>Video</th><th>Source / format</th><th>Status</th><th>Delivery history</th><th>Actions</th></tr></thead><tbody>${visible.map(a=>`<tr><td><div class="row"><div class="thumb">${art(a.art)}</div><div><strong class="asset-title">${esc(a.title)}</strong><div class="asset-sub">${esc(a.filename)}${a.priority?' · Priority':''}</div><div class="asset-sub">${duration(a.duration)} · ${a.width} × ${a.height}</div></div></div></td><td>${sourceName(a.source)}<div class="asset-sub">${a.ingested}</div></td><td>${status(a.state)}</td><td>${a.deliveries.filter(d=>d.state==='published').length?pill(a.deliveries.filter(d=>d.state==='published').length+' destinations','green'):'<span class="muted">Not delivered</span>'} function lockedField(name,label,value,rows=3){return `<div class="field"><div class="row between" style="margin-bottom:7px"><label for="compose-${name}" style="margin:0">${label}</label><button class="btn ghost small-btn" data-action="lock-field" data-id="${name}" aria-pressed="${!!state.compose.locks[name]}">${icon(state.compose.locks[name]?'lock':'unlock')}${state.compose.locks[name]?'Locked':'Auto / editable'}</button></div>${rows===0?`<input id="compose-${name}" data-bind="compose.${name}" value="${esc(value)}">`:`<textarea id="compose-${name}" data-bind="compose.${name}" rows="${rows}">${esc(value)}</textarea>`}</div>`;}
function composePreview(){const c=state.compose,a=getAsset(c.asset),isIG=state.composeTab==='instagram',acc=c.accounts.map(getAccount).find(a=>a?.platform===(isIG?'instagram':'youtube')),override=acc?c.overrides[acc.id]||{}:{},meta=effectiveMetadata(c,acc?.id);return `<div class="phone"><div class="phone-media">${a&&fileURLs.has(a.id)?`<video controls preload="metadata" src="${esc(fileURLs.get(a.id))}"></video>`:art(a?.art||'orbit')}<span class="pill purple" style="position:absolute;top:12px;left:12px">${a&&fileURLs.has(a.id)?'Local video':'Sample artwork'}</span>${a&&!fileURLs.has(a.id)?'<div class="phone-caption">Your video.<br>A clearer story.</div>':''}</div><div class="phone-meta light-keep"><strong>${esc(acc?.handle||(isIG?'Instagram preview':'YouTube preview'))}</strong><p>${esc(isIG?(meta.caption||'Your caption appears here.'):meta.title)}</p><p>${esc(isIG?'':(meta.description||'Add a description to complete the preview.'))}</p></div></div>`;}
function renderCompose(){const c=state.compose,a=getAsset(c.asset);return head(button(icon('upload')+'Add a video','upload-videos','','ghost'))+`<div class="steps"><span class="step active"><i>1</i>Video</span><span class="step active"><i>2</i>Destinations</span><span class="step active"><i>3</i>Metadata & review</span><span class="step"><i>4</i>Delivery</span></div><div class="split-wide"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>Choose your video</h2><p>The selected content is shared across every destination.</p></div>${a?status(a.state):''}</div><div class="field"><label for="compose-asset">Library video</label><select id="compose-asset" data-bind="compose.asset">${state.assets.map(v=>`<option value="${v.id}" ${c.asset===v.id?'selected':''}>${esc(v.title)} · ${duration(v.duration)} · ${v.state}</option>`).join('')}</select></div>${a?`<div class="row"><div class="thumb wide">${art(a.art)}</div><div class="grow"><strong class="small">${esc(a.filename)}</strong><div class="asset-sub">${a.width} × ${a.height} · ${duration(a.duration)} · ${sourceName(a.source)}</div></div>${button('View details','asset-details',`data-id="${a.id}"`,'ghost small-btn')}</div>`:''}<div class="field mt"><label for="compose-summary">Content summary / transcript context</label><textarea id="compose-summary" data-bind="compose.summary" placeholder="Paste the actual content summary or transcript before drafting metadata.">${esc(c.summary??a?.summary??'')}</textarea><p class="tiny muted" style="margin-top:6px">Sample records have illustrative context. Filename-only analysis is insufficient.</p></div></section><section class="panel"><div class="panel-head"><div><h2>Exact destinations</h2><p>Each account gets its own delivery and receipt.</p></div>${pill(c.accounts.length+' selected','purple')}</div><div class="grid2" style="gap:12px">${state.accounts.map(ac=>`<div class="channel-line ${c.accounts.includes(ac.id)?'selected':''}"><input type="checkbox" data-account </section><section class="panel"><div class="panel-head"><div><h2>Delivery settings</h2><p>Freeze the exact asset, metadata and account selection.</p></div>${icon('shield')}</div><div class="field-grid"><div class="field"><label for="compose-mode">Action</label><select id="compose-mode" data-bind="compose.mode"><option value="draft" ${c.mode==='draft'?'selected':''}>Save a local demo draft</option><option value="schedule" ${c.mode==='schedule'?'selected':''}>Simulate scheduled delivery</option><option value="now" ${c.mode==='now'?'selected':''}>Simulate dispatch now</option></select></div><div class="field"><label for="compose-privacy">YouTube visibility</label><select id="compose-privacy" data-bind="compose.privacy"><option value="private" ${c.privacy==='private'?'selected':''}>Private · test visibility</option><option value="unlisted" ${c.privacy==='unlisted'?'selected':''}>Unlisted</option><option value="public" ${c.privacy==='public'?'selected':''}>Public</option></select></div></div>${c.mode==='schedule'?`<div class="field"><label for="compose-scheduled">Scheduled time · ${esc(state.settings.timezone)}</label><input type="datetime-local" id="compose-scheduled" data-bind="compose.scheduled" value="${esc(c.scheduled)}"><div class="row mt" style="margin-top:9px">${button('Use next automation slot','compose-next-slot','','ghost small-btn')}<span class="tiny muted">Past times are rejected.</span></div></div>`:''}<label class="check"><input type="checkbox" data-bind="compose.repost" ${c.repost?'checked':''}><span>Intentional repost as a new edition<small>Normal manual and automatic delivery share the same no-repeat history.</small></span></label><div class="note mt">No platform call is made here. Production approval must reference the exact media bytes and account IDs.</div><div class="row between mt"><span class="tiny muted">${c.accounts.length} destinations · preset v${getPreset(c.preset)?.version||1}</span>${button(icon(c.mode==='draft'?'file':'eye')+(c.mode==='draft'?'Save draft':'Review simulation'),'review-compose','','primary')}</div></section></div><aside class="stack"><section class="panel"><div class="panel-head"><div><h2>Platform preview</h2><p>${state.composeTab==='youtube'?'YouTube Shorts':'Instagram Reel'} · illustrative layout</p></div>${pill('9:16')}</div><div id="compose-preview">${composePreview()}</div><p class="tiny muted" style="margin-top:18px">Added local files play in this browser. Sample library entries contain artwork, not real rendered video.</p></section><section class="panel"><h3>Before dispatch</h3><div class="quality-row mt">${icon('check')}<span class="grow">Exact destination identity</span>${pill(c.accounts.length?'Selected':'Needed',c.accounts.length?'green':'amber')}</div><div class="quality-row">${icon('file')}<span class="grow">Content analysis</span>${pill((c.summary??a?.summary)?'Context added':'Needed',(c.summary??a?.summary)?'purple':'amber')}</div><div class="quality-row">${icon('lock')}<span class="grow">Manual field locks</span>${pill(Object.values(c.locks).filter(Boolean).length+' locked')}</div><div class="quality-row">${icon('eye')}<span class="grow">Remote / public readiness</span>${pill('Not verified','amber')}</div></section></aside></div>`;}
function sceneArtwork(s){const r=replacementURLs.get(s.id);return r?(r.type.startsWith('video/')?`<video muted preload="metadata" src="${esc(r.url)}" style="width:100%;height:100%;object-fit:cover"></video>`:`<img src="${esc(r.url)}" alt="${esc(s.label)} local replacement">`):art(s.art||'orbit',s.revision);}
function currentScenes(p){return p.scenes.every(s=>s.visual==='current'&&s.audio==='current');}
function canApprove(p){return currentScenes(p)&&p.renderedRevision===p.revision&&Object.values(p.quality).every(Boolean);}

','','ghost small-btn')}</div><div class="filmstrip">${p.scenes.map((sc,i)=>`<button class="scene ${s.id===sc.id?'active':''}" data-action="select-scene" data-id="${sc.id}" aria-pressed="${s.id===sc.id}"><div class="scene-image">${sceneArtwork(sc)}<span class="scene-num">SCENE ${String(i+1).padStart(2,'0')}${sc.locked?' · LOCKED':''}</span><span class="scene-time">${sc.duration}s</span></div><div class="scene-info"><strong>${esc(sc.label)}</strong><div class="row gap-6">${status(sc.visual)}${sc.audio!=='current'?status(sc.audio):pill('Audio current')}</div></div></button>`).join('')}</div><div class="note mt">Sample artwork and placeholder narration illustrate the editor. A real generated MP4, factual sources and rights evidence are still required for production acceptance.</div><div class="row between mt"><span class="tiny muted">Unchanged assets and audio should be reused.</span>${button(icon('refresh')+'Rebuild demo preview','rebuild-preview',busy.has(p.id)?'disabled':'','primary')}</div>${busy.has(p.id)?'<div class="loading-bar"><span></span></div>':''}</section><section class="panel"><div class="panel-head"><div><h2>Voice, captions & music</h2><p>Time the scene against its actual narration audio.</p></div>${icon('headphones')}</div><div class="grid3"><div><div class="eyebrow">Narration</div><p class="small" style="margin-top:7px">${esc(p.audioConfig?.voice||getPreset(p.preset)?.voice||'Selected voice')}</p><p class="tiny muted" style="margin-top:4px">Production voice follows the profile.</p></div><div><div class="eyebrow">Captions</div><p class="small" style="margin-top:7px">Highlighted · portrait safe area</p><p class="tiny muted" style="margin-top:4px">Inspect timing and pronunciations.</p></div><div><div class="eyebrow">Music</div><p class="small" style="margin-top:7px">Licensed track · speech ducking</p><p class="tiny muted" style="margin-top:4px">Configured mix, never assumed rights.</p></div></div><div class="row mt">${button('Configure audio & captions', nel-head"><div><h2>Reserved clip drafts</h2><p>Retain source URL and exact start/end range.</p></div>${pill(state.clips.length+' drafts')}</div>${state.clips.length?`<div class="grid3">${state.clips.map(c=>`<div class="clip-window"><div class="row between">${icon('scissors')}${status(c.state)}</div><h3>${esc(c.title)}</h3><p>${c.start}s → ${c.end}s · ${c.end-c.start}s excerpt</p><p style="margin-top:7px;overflow-wrap:anywhere">${esc(c.url)}</p><p style="margin-top:9px">${esc(c.reason)}</p><div class="row mt">${button('Add demo clip to library','bridge-clip',`data-id="${c.id}" ${c.state==='ready'?'disabled':''}`,'ghost small-btn')}</div></div>`).join('')}</div>`:`<div class="empty">${icon('scissors')}<h3>No clip moments reserved</h3><p>Add a source URL and time range to explore the clipping workflow.</p></div>`}</section>`;}

function presetModal(id){const p=getPreset(id)||{...seed().presets[0],name:'',brand:''};showModal(id?'Edit preset · new version':'Create a preset',`<form id="preset-form" data-submit="preset"><div class="field-grid"><div class="field"><label>Name</label><input aria-label="Preset name" name="name" required value="${esc(p.name)}"></div><div class="field"><label>Brand / channel</label><input aria-label="Brand name" name="brand" required value="${esc(p.brand)}"></div></div><div class="field"><label>Audience</label><textarea aria-label="Audience" name="audience">${esc(p.audience)}</textarea></div><div class="field-grid"><div class="field"><label>Language</label><select aria-label="Language" name="language">${['English','Hindi'].map(v=>`<option ${p.language===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Generated Shorts duration</label><input aria-label="Generated short duration" name="duration" type="number" min="30" max="55" required value="${p.duration}"></div></div><div class="field"><label>Tone / editorial instructions</label><input aria-label="Editorial tone" name="tone" value="${esc(p.tone)}"></div><div class="field-grid"><div class="field"><label>Voice</label><select aria-label="Preset voice" name="voice">${['Kokoro · af_bella','Piper · selected voice'].map(v=>`<option ${p.voice===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Visual palette</label><select aria-label="Visual palette" name="palette">${['Navy / mint','Navy / lavender'].map(v=>`<option ${p.palette===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Story / visual direction</label><textarea aria-label="Story and visual direction" name="description">${esc(p.description)}</textarea></div><div class="field"><label>YouTube title template</label><input aria-label="Title template" name="titleTemplate" value="${esc(p.titleTemplate)}"></div><div class="field"><label>Caption / description template</ function effectiveMetadata(c,id){const v=c.overrides[id]||{},hashtags=v.hashtags||c.hashtags||'',append=(text)=>{const body=String(text||''),tokens=Array.from(new Set(hashtags.split(/\s+/).filter(Boolean))),existing=new Set(body.split(/\s+/));const missing=tokens.filter(t=>!existing.has(t));return body+(missing.length?'\n\n'+missing.join(' '):'');};return {title:v.title||c.title||'',description:append(v.description||c.description),caption:append(v.caption||c.caption),tags:v.tags||c.tags||'',hashtags};}

function setBound(path,value){const keys=path.split('.');let target=state;for(const k of keys.slice(0,-1))target=target[k];target[keys.at(-1)]=value;}

async function addLocalVideos(files){if(files.length>10){notify('Preview up to 10 local videos at a time in this browser.');files=files.slice(0,10);}for(const file of files){if(file.size>100*1024*1024){notify('This browser preview supports files up to 100 MB. Production ingestion must stream larger files on the server.');continue;}if(!file.type.startsWith('video/')&&!/\.(mp4|mov|webm)$/i.test(file.name)){notify('Choose a video file.');continue;}let hash=null;try{if(globalThis.crypto?.subtle){const digest=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());hash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');}}catch(e){}const url=URL.createObjectURL(file),duplicate=hash&&state.assets.find(a=>a.hash===hash);if(duplicate){if(fileURLs.has(duplicate.id))URL.revokeObjectURL(fileURLs.get(duplicate.id));fileURLs.set(duplicate.id,url);notify('Exact duplicate recognized; existing identity and delivery history retained.');continue;}const metadata=await new Promise(resolve=>{const v=document.createElement('video');let done=false;const finish=data=>{if(done)return;done=true;clearTimeout(timer);v.removeAttribute('src');v.load();resolve(data);};const timer=setTimeout(()=>finish(null),8000);v.preload='metadata';v.onloadedmetadata=()=>finish({duration:v.duration,width:v.videoWidth,height:v.videoHeight});v.onerror=()=>finish(null);v.src=url;});if(!metadata||!Number.isFinite(metadata.duration)||!metadata.duration||!metadata.width){URL.revokeObjectURL(url);notify('The browser could not read this video. Production should probe/quarantine it on the server.');continue;}const id=uid('asset');fileURLs.set(id,url);state.assets.push({id,title:file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),filename:file.name,duration:Math.round(metadata.duration*10)/10,width:metadata.width,height:metadata.height,source:'upload',state:'ready',art:'city',summary:'',hash:hash||'UNVERIFIED_BROWSER_'+id,ingested:new Date().toISOString().slice(0,10),deliveries:[],edition:1,priority:0});audit('Added browser-local video '+file.name+'; no server upload occurred.');notify('Local video preview added. Add content context before drafting metadata.');}navigate('library');}
$('#video-file').addEventListener('change',async e=>{await addLocalVideos(Array.from(e.target.files||[]));e.target.value='';});
$('#replacement-file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f||!replacementTarget)return;if(!['image/png','image/jpeg','image/webp','video/mp4','video/webm'].includes(f.type)||f.size>100*1024*1024){notify('Use PNG/JPEG/WebP or MP4/WebM within the browser preview limit.');return;}const p=state.studio.find(p=>p.id===replacementTarget.productionId),s=p?.scenes.find(s=>s.id===replacementTarget.sceneId);if(!s||s.locked)return;const old=replacementURLs.get(s.id);if(old)URL.revokeObjectURL(old.url);replacementURLs.set(s.id,{url:URL.createObjectURL(f),type:f.type});s.replacement=true;s.replacementFilename=f.name;s.kind='Uploaded media';s.visual='current';s.sources='Operator rights declaration · demo, unverified';s.revision++;changeProduction(p,'Applied browser-local replacement',s);replacementTarget=null;e.target.value='';closeModal();navigate('studio');notify('Local replacement attached. Bytes need re-selection after refresh.');});
