app:
  name: "TubeForge"
  environment: "development"
  bind_host: "127.0.0.1"
  port: 8080
database:
  url: "sqlite:///./data/tubeforge.db"
  busy_timeout_ms: 5000
pipeline:
  provider: "fake"
  fake:
    enabled: true
    artifact_root: "./data/fake-artifacts"
    voice_id: "fake-voice"
    media_license: "CC0-1.0"
  codex:
    executable: "codex"
    model: "gpt-5.2-codex"
    timeout_seconds: 900
    max_output_bytes: 2000000
    max_diagnostic_bytes: 8192
    reservation_seconds: 1200
    repair_attempt_limit: 0
    prompt_template_version: "m6-content-v1"
    max_prompt_chars: 60000
  piper:
    executable: "piper"
    model_path: null
    config_path: null
    voice_id: "piper"
    speaker: null
    output_format: "wav"
    sample_rate: null
    timeout_seconds: 120
    max_output_bytes: 100000000
    max_diagnostic_bytes: 8192
    threads: 1
    cache_root: "./data/cache/tts"
    adapter_version: "m7-piper-v1"
  voice:
    artifact_root: "./data/artifacts"
    ffmpeg_executable: "ffmpeg"
    ffprobe_executable: "ffprobe"
    ffmpeg_threads: 1
    pause_seconds: 0.15
    caption_line_length: 42
    duration_tolerance_seconds: 0.15
worker:
  max_active_jobs: 1
  lease_seconds: 300
  max_attempts: 3
  retry_base_seconds: 30
  retry_max_seconds: 900
