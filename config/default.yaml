app:
  name: "TubeForge"
  environment: "development"
  bind_host: "127.0.0.1"
  port: 8080
database:
  url: "sqlite:///./data/tubeforge.db"
  busy_timeout_ms: 5000
pipeline:
  provider: "fake"
  fake:
    enabled: true
    artifact_root: "./data/fake-artifacts"
    voice_id: "fake-voice"
    media_license: "CC0-1.0"
worker:
  max_active_jobs: 1
  lease_seconds: 300
  max_attempts: 3
  retry_base_seconds: 30
  retry_max_seconds: 900
