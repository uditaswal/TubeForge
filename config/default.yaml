app:
  name: "TubeForge"
  environment: "development"
  bind_host: "127.0.0.1"
  port: 8080
auth:
  enabled: false
  session_hours: 12
  secure_cookies: false
database:
  url: "sqlite:///./data/tubeforge.db"
  busy_timeout_ms: 5000
pipeline:
  content_provider: "fake"
  voice_provider: "fake"
  video_generation:
    default_preset: "default"
    presets:
      default:
        duration_seconds: 60
        aspect_ratio: "16:9"
        captions_enabled: true
        review_mode: "manual"
      shorts:
        duration_seconds: 45
        minimum_duration_seconds: 30
        maximum_duration_seconds: 120
        aspect_ratio: "9:16"
        captions_enabled: true
        review_mode: "manual"
    music_catalog: []
  fake:
    enabled: true
    artifact_root: "./data/fake-artifacts"
    voice_id: "fake-voice"
    media_license: "CC0-1.0"
  codex:
    executable: "codex"
    model: "gpt-5.6-sol"
    timeout_seconds: 900
    max_output_bytes: 2000000
    max_diagnostic_bytes: 8192
    reservation_seconds: 1200
    repair_attempt_limit: 0
    prompt_template_version: "m6-content-v7"
    max_prompt_chars: 60000
  piper:
    executable: "piper"
    model_path: null
    config_path: null
    voice_id: "piper"
    speaker: null
    output_format: "wav"
    sample_rate: null
    timeout_seconds: 120
    max_output_bytes: 100000000
    max_diagnostic_bytes: 8192
    threads: 1
    cache_root: "./data/cache/tts"
    adapter_version: "m7-piper-v1"
  kokoro:
    enabled: true
    voices: ["af_bella", "af_sarah", "am_michael"]
    model_path: "./models/kokoro-v1.0.int8.onnx"
    voices_path: "./models/voices-v1.0.bin"
    cache_root: "./data/cache/kokoro"
    sample_rate: 24000
  voice:
    artifact_root: "./data/artifacts"
    ffmpeg_executable: "ffmpeg"
    alignment_provider: "local-waveform-v1"
  preview:
    width: 854
    height: 480
    fps: 30
    pixel_format: "yuv420p"
    video_codec: "libx264"
    audio_codec: "aac"
    audio_bitrate: "128k"
    audio_sample_rate: 48000
    threads: 1
    timeout_seconds: 900
    ffprobe_timeout_seconds: 30
    minimum_free_bytes: 250000000
    sync_tolerance_seconds: 0.25
    fps_tolerance: 0.05
    caption_font_size: 26
    image_motion_enabled: true
    image_motion_zoom: 1.08
  final:
    width: 1920
    height: 1080
    fps: 30
    pixel_format: "yuv420p"
    video_codec: "libx264"
    audio_codec: "aac"
    audio_bitrate: "160k"
    audio_sample_rate: 48000
    threads: 1
    timeout_seconds: 1800
    ffprobe_timeout_seconds: 30
    minimum_free_bytes: 500000000
    sync_tolerance_seconds: 0.25
    fps_tolerance: 0.05
    caption_font_size: 34
    image_motion_enabled: true
    image_motion_zoom: 1.08
    renderer_version: "m10-final-v1"
  shorts_preview:
    width: 540
    height: 960
    fps: 30
    audio_sample_rate: 48000
    caption_font_size: 46
    caption_margin_vertical: 180
    caption_margin_horizontal: 48
    word_highlight_captions: true
    scene_max_duration_seconds: 3.0
  shorts_final:
    width: 1080
    height: 1920
    video_crf: 18
    fps: 30
    audio_sample_rate: 48000
    caption_font_size: 84
    caption_margin_vertical: 470
    caption_margin_horizontal: 96
    caption_center_x: 490
    word_highlight_captions: true
    scene_max_duration_seconds: 3.0
  publication:
    title_max_length: 100
    description_max_length: 5000
    tag_max_count: 30
    tag_max_length: 100
    tag_payload_max_length: 500
    metadata_template_version: "m12-metadata-v1"
    thumbnail_template_version: "m12-thumbnail-v1"
    thumbnail_width: 1280
    thumbnail_height: 720
    thumbnail_max_bytes: 2000000
  youtube:
    enabled: false
    dry_run: true
    provider: "youtube"
    client_secret_path: null
    token_storage_path: null
    expected_channel_id: null
    privacy: "private"
    chunk_size_bytes: 8388608
    implementation_version: "m13-youtube-v1"
  verification:
    enabled: true
    pending_poll_seconds: 300
    maximum_processing_wait_seconds: 86400
  analytics:
    enabled: true
    initial_delay_hours: 24
    collection_interval_hours: 24
    collection_horizon_days: 30
    query_version: "m15-v1"
  performance:
    evaluator_version: "m16-v1"
    proposal_version: "m16-proposal-v1"
    min_views_for_retention: 100
    min_impressions_for_ctr: 500
    baseline_min_videos: 5
  optimization:
    candidates:
      enabled: true
      max_title_candidates: 3
      max_thumbnail_candidates: 2
      template_version: "m17-v1"
    execution:
      enabled: false
      dry_run: true
      executor_version: "m18-v1"
    experiment:
      minimum_observation_hours: 24
      evaluation_window_days: 7
  media:
    # "hybrid" lets each dashboard job choose local generated art or
    # rights-safe public-domain/CC0 Wikimedia stock; no Google image scraping.
    provider: "hybrid"
    cache_root: "./data/cache/assets"
    allowed_hosts: ["upload.wikimedia.org", "commons.wikimedia.org"]
    allowed_licenses: ["CC0-1.0", "CC BY 4.0", "CC BY-SA 4.0", "Public Domain"]
    allowed_media_types: ["image", "video"]
    timeout_seconds: 30
    max_redirects: 0
    max_bytes: 100000000
    max_width: 12000
    max_height: 12000
    max_duration_seconds: 900
    min_width: 64
    min_height: 64
    allowed_extensions: [".png", ".mp4", ".webm"]
    retries: 3
    wikimedia_api_url: "https://commons.wikimedia.org/w/api.php"
  sources:
    enabled: false
    allowed_hosts: []
    timeout_seconds: 20
    max_bytes: 2000000
    max_chars: 24000

worker:
  max_active_jobs: 1
  lease_seconds: 300
  heartbeat_seconds: 60
  max_attempts: 3
  retry_base_seconds: 30
  retry_max_seconds: 900
scheduler:
  poll_seconds: 15
  topic_reservation_seconds: 600
