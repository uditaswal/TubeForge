app:
  name: "TubeForge"
  environment: "production"
  bind_host: "0.0.0.0"
  port: 8080
auth:
  enabled: true
  session_hours: 12
  secure_cookies: true
  login_attempt_limit: 5
  login_window_seconds: 300
database:
  url: "sqlite:////app/data/tubeforge.db"
  busy_timeout_ms: 5000
pipeline:
  # Production scripts cross only the host's restricted Unix-socket runner.
  content_provider: "codex"
  voice_provider: "hybrid"
  codex:
    model: "gpt-5.6-sol"
    socket_path: "/run/tubeforge-codex/codex.sock"
    socket_timeout_seconds: 490
    invocation_limit: 2
    reservation_seconds: 1200
    prompt_template_version: "m6-content-v6"
  video_generation:
    default_preset: "default"
    presets:
      default:
        duration_seconds: 60
        captions_enabled: true
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "manual"
        mcp_servers: []
      short-explainer:
        duration_seconds: 60
        captions_enabled: true
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "auto"
        mcp_servers: []
      shorts:
        duration_seconds: 45
        minimum_duration_seconds: 30
        maximum_duration_seconds: 55
        aspect_ratio: "9:16"
        captions_enabled: true
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "manual"
        mcp_servers: []
      silent:
        duration_seconds: 60
        captions_enabled: false
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "manual"
        mcp_servers: []
    music_catalog: [] # Add approved free tracks with source/license URLs here.
  piper:
    executable: "python" # Uses the Piper package bundled in the local media image.
    # Download a Piper voice and its matching .onnx.json sidecar into
    # ./models before selecting voice_provider: piper.
    model_path: "/app/models/en_US-lessac-medium.onnx"
    config_path: "/app/models/en_US-lessac-medium.onnx.json"
    voice_id: "en_US-lessac-medium"
    cache_root: "/app/data/cache/tts"
  kokoro:
    enabled: true
    # These natural local English voices are selectable in Creator Studio.
    # The model is downloaded by the Kokoro runtime on its first use.
    voices: ["af_bella", "af_sarah", "am_michael"]
    model_path: "/app/models/kokoro-v1.0.int8.onnx"
    voices_path: "/app/models/voices-v1.0.bin"
    cache_root: "/app/data/cache/kokoro"
    sample_rate: 24000
  voice:
    artifact_root: "/app/data/artifacts"
    ffmpeg_threads: 1
    ffmpeg_executable: "ffmpeg"
    ffprobe_executable: "ffprobe"
  media:
    # Each job can select local generated art or rights-safe Wikimedia stock.
    # Google Image results are never used because they have no reuse proof.
    provider: "hybrid"
    cache_root: "/app/data/cache/assets"
  sources:
    enabled: false # Enable only with a tight HTTPS host allowlist.
    allowed_hosts: []
  source_clips:
    enabled: true
    ytdlp_executable: "yt-dlp"
    timeout_seconds: 45
    min_clip_seconds: 15
    max_clip_seconds: 60
    padding_seconds: 3
  shorts_preview:
    width: 540
    height: 960
    fps: 30
    caption_font_size: 46
    caption_margin_vertical: 180
    caption_margin_horizontal: 48
    word_highlight_captions: true
    scene_max_duration_seconds: 3.0
    minimum_free_bytes: 250000000
  shorts_final:
    width: 1080
    height: 1920
    video_crf: 18
    fps: 30
    caption_font_size: 80
    caption_margin_vertical: 360
    caption_margin_horizontal: 96
    word_highlight_captions: true
    scene_max_duration_seconds: 3.0
    minimum_free_bytes: 500000000
  youtube:
    enabled: false
    dry_run: true
worker:
  max_active_jobs: 1
  lease_seconds: 300
  heartbeat_seconds: 60
  max_attempts: 3
  retry_base_seconds: 30
  retry_max_seconds: 900
