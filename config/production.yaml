app:
  name: "TubeForge"
  environment: "production"
  bind_host: "127.0.0.1"
  port: 8080
auth:
  enabled: true
  session_hours: 12
  secure_cookies: true
  login_attempt_limit: 5
  login_window_seconds: 300
database:
  url: "sqlite:///./data/tubeforge.db"
  busy_timeout_ms: 5000
pipeline:
  # Production scripts cross only the host's restricted Unix-socket runner.
  content_provider: "codex"
  voice_provider: "piper-http"
  codex:
    model: "gpt-5.6-sol"
    socket_path: "/run/tubeforge-codex/codex.sock"
    socket_timeout_seconds: 490
    invocation_limit: 2
    reservation_seconds: 1200
    prompt_template_version: "m6-content-v7"
  # Optional second script owner, selectable per job in Creator Studio. It talks
  # to a user-level runner (scripts/run_claude_runner.sh) over a socket under
  # ./data/run/claude, which the worker container already bind-mounts.
  claude:
    enabled: true
    # Per-job choices (sonnet-medium default, opus) are allow-listed in host_claude_runner.MODELS.
    model: "claude-sonnet-5-5"
    socket_path: "/app/data/run/claude/claude.sock"
    socket_timeout_seconds: 590
    invocation_limit: 2
    reservation_seconds: 1200
    prompt_template_version: "m6-content-v7"
  video_generation:
    default_preset: "default"
    presets:
      default:
        duration_seconds: 60
        captions_enabled: true
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "manual"
        mcp_servers: []
      short-explainer:
        duration_seconds: 60
        captions_enabled: true
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "auto"
        mcp_servers: []
      shorts:
        duration_seconds: 45
        minimum_duration_seconds: 30
        maximum_duration_seconds: 120
        aspect_ratio: "9:16"
        captions_enabled: true
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "manual"
        mcp_servers: []
      # Reference Shorts: 9:16, 6–8 scenes, shared renderer (rendering/shorts).
      reference-short:
        duration_seconds: 36
        minimum_duration_seconds: 30
        maximum_duration_seconds: 45
        aspect_ratio: "9:16"
        prompt_version: "m6-content-v8"
        captions_enabled: true
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "manual"
        mcp_servers: []
      silent:
        duration_seconds: 60
        captions_enabled: false
        music_track: null
        visual_style: "cinematic-tech"
        review_mode: "manual"
        mcp_servers: []
    music_catalog: [] # Add approved free tracks with source/license URLs here.
  piper:
    server_url: "http://127.0.0.1:5000"
    listen_host: "127.0.0.1"
    listen_port: 5000
    executable: "python" # Retained for optional direct local development.
    # Download a Piper voice and its matching .onnx.json sidecar into
    # ./models before selecting voice_provider: piper.
    model_path: "./models/en_US-lessac-medium.onnx"
    config_path: "./models/en_US-lessac-medium.onnx.json"
    voice_id: "en_US-lessac-medium"
    cache_root: "./data/cache/tts"
  kokoro:
    enabled: true
    # These natural local English voices are selectable in Creator Studio.
    # The model is downloaded by the Kokoro runtime on its first use.
    voices: ["af_bella", "af_sarah", "am_michael"]
    model_path: "./models/kokoro-v1.0.int8.onnx"
    voices_path: "./models/voices-v1.0.bin"
    cache_root: "./data/cache/kokoro"
    sample_rate: 24000
  voice:
    artifact_root: "./data/artifacts"
    ffmpeg_threads: 1
    ffmpeg_executable: "ffmpeg"
    ffprobe_executable: "ffprobe"
    # Keep the existing timing method until the independent C3 acceptance gate.
    alignment_provider: "local-waveform-v1"
  reference_short:
    # Shared reference-short-v1 renderer: native Kokoro + Whisper forced alignment.
    alignment_model_path: "./data/benchmark/models/models--Systran--faster-whisper-base.en/snapshots/3d3d5dee26484f91867d81cb899cfcf72b96be6c"
    voice: "af_bella"
    budget_realtime_factor: 20
  media:
    # Each job can select local generated art or rights-safe Wikimedia stock.
    # Google Image results are never used because they have no reuse proof.
    provider: "hybrid"
    cache_root: "./data/cache/assets"
  sources:
    research_enabled: true
    enabled: false # Enable only with a tight HTTPS host allowlist.
    allowed_hosts: []
  source_clips:
    enabled: true
    ytdlp_executable: "yt-dlp"
    timeout_seconds: 45
    min_clip_seconds: 15
    max_clip_seconds: 60
    padding_seconds: 3
  preview:
    audio_normalization_enabled: true
  final:
    audio_normalization_enabled: true
  shorts_preview:
    width: 540
    height: 960
    fps: 30
    audio_sample_rate: 48000
    audio_normalization_enabled: true
    caption_font_size: 46
    caption_margin_vertical: 180
    caption_margin_horizontal: 48
    word_highlight_captions: true
    scene_max_duration_seconds: 3.0
    minimum_free_bytes: 250000000
  shorts_final:
    width: 1080
    height: 1920
    video_crf: 18
    fps: 30
    audio_sample_rate: 48000
    audio_normalization_enabled: true
    caption_font_size: 84
    caption_margin_vertical: 470
    caption_margin_horizontal: 96
    caption_center_x: 490
    word_highlight_captions: true
    scene_max_duration_seconds: 3.0
    minimum_free_bytes: 500000000
  youtube:
    enabled: false
    dry_run: true
worker:
  max_active_jobs: 1
  lease_seconds: 300
  heartbeat_seconds: 60
  max_attempts: 3
  retry_base_seconds: 30
  retry_max_seconds: 900
