# Local guards run on every commit. Install once per clone:
#   pre-commit install            (needs gitleaks on PATH or uses the pinned hook below)
# Run on everything: pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: forbid-new-submodules
  - repo: local
    hooks:
      - id: no-generated-files
        name: block generated media, logs, databases and env files
        language: fail
        entry: "Generated/runtime/secret file staged; add it to .gitignore instead"
        files: '(\.(log|db|sqlite3?|onnx|safetensors|gguf|mp4|mov|wav|mp3)$|(^|/)\.env($|\.)|^(data|models|artifacts|autonomous_logs)/|AUTONOMOUS_PROGRESS\.md)'
        exclude: '^(tests/fixtures|examples|src/tubeforge/assets/sfx)/|\.env\.example$'
      - id: no-ai-attribution
        name: reject AI attribution trailers in commit messages
        language: pygrep
        entry: '(?i)(^co-authored-by:.*(claude|anthropic|openai|codex|copilot|noreply@anthropic)|generated with \[?claude)'
        stages: [commit-msg]
